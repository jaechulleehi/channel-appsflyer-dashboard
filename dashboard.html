<title>채널 x 앱스플라이어 성과 리포트</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --paper: #eeece4;
    --paper-raised: #f7f5ee;
    --ink: #1c2320;
    --ink-dim: #5b6259;
    --line: #d8d4c6;
    --accent: #b5751b;
    --accent-ink: #6e4310;
    --google: #3457c9;
    --meta: #c22e63;
    --naver: #2f8f4e;
    --good: #2f8f4e;
    --warn: #b5751b;
    --bad: #b3402f;
    --shadow: 0 1px 2px rgba(28, 35, 32, 0.06), 0 8px 24px -12px rgba(28, 35, 32, 0.18);
  }

  :root[data-theme="dark"] {
    --paper: #14181a;
    --paper-raised: #1b2124;
    --ink: #e9e6dc;
    --ink-dim: #9aa39a;
    --line: #2c3436;
    --accent: #e0a648;
    --accent-ink: #f2c887;
    --google: #7c9bff;
    --meta: #ff7fa8;
    --naver: #63d18a;
    --good: #63d18a;
    --warn: #e0a648;
    --bad: #ff8b76;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181a;
      --paper-raised: #1b2124;
      --ink: #e9e6dc;
      --ink-dim: #9aa39a;
      --line: #2c3436;
      --accent: #e0a648;
      --accent-ink: #f2c887;
      --google: #7c9bff;
      --meta: #ff7fa8;
      --naver: #63d18a;
      --good: #63d18a;
      --warn: #e0a648;
      --bad: #ff8b76;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -16px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }

  .num { font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }

  header.masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }

  h1 {
    font-family: ui-serif, Georgia, "Noto Serif KR", serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    margin: 0 0 6px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .meta-line { color: var(--ink-dim); font-size: 0.86rem; }
  .meta-line .num { color: var(--ink); }

  .filecount {
    text-align: right;
    font-size: 0.78rem;
    color: var(--ink-dim);
    line-height: 1.6;
  }

  .filecount b { color: var(--ink); font-weight: 600; }

  section { margin-bottom: 44px; }

  h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    font-weight: 600;
    margin: 0 0 14px;
  }

  /* KPI strip */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .kpi {
    background: var(--paper-raised);
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .kpi .label { font-size: 0.72rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .kpi .value { font-size: 1.3rem; font-weight: 600; }
  .kpi .sub { font-size: 0.72rem; color: var(--accent-ink); }

  .kpi .bar-track { height: 3px; background: var(--line); border-radius: 2px; margin-top: 2px; overflow: hidden; }
  .kpi .bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

  @media (max-width: 760px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 460px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* Channel comparison */
  .channel-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .channel-grid { grid-template-columns: 1fr; } }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  thead th {
    text-align: right;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    font-weight: 600;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  thead th:first-child, tbody td:first-child { text-align: left; }

  tbody td {
    padding: 9px 12px;
    text-align: right;
    font-size: 0.86rem;
    border-bottom: 1px solid var(--line);
  }
  tbody tr:last-child td { border-bottom: none; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  .chip::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot, var(--ink-dim));
  }
  .chip.google { --dot: var(--google); }
  .chip.meta { --dot: var(--meta); }
  .chip.naver { --dot: var(--naver); }

  .roas-good { color: var(--good); }
  .roas-warn { color: var(--warn); }
  .roas-bad { color: var(--bad); }

  /* bar chart (channel cost/revenue) */
  .barchart {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row .name { font-size: 0.82rem; font-weight: 600; }
  .bar-row .track { height: 22px; background: var(--paper); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
  .bar-row .fill { height: 100%; border-radius: 5px 0 0 5px; }
  .bar-row .val { font-size: 0.8rem; text-align: right; }
  .legend { display: flex; gap: 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 0.75rem; color: var(--ink-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* campaign bars */
  .camp-row { display: grid; grid-template-columns: 220px 1fr 110px; gap: 12px; align-items: center; padding: 7px 0; }
  .camp-row .track { height: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .camp-row .fill { height: 100%; }
  .camp-row .label { font-size: 0.78rem; display: flex; align-items: center; gap: 6px; }
  .camp-row .stat { font-size: 0.76rem; text-align: right; color: var(--ink-dim); }
  .camp-wrap { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; box-shadow: var(--shadow); }

  /* creative table roas bullet */
  .roas-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .roas-cell .mini-track { width: 60px; height: 6px; border-radius: 3px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
  .roas-cell .mini-fill { height: 100%; }

  .table-scroll { overflow-x: auto; border-radius: 10px; }

  footer {
    color: var(--ink-dim);
    font-size: 0.76rem;
    border-top: 1px solid var(--line);
    padding-top: 16px;
    margin-top: 8px;
  }

  .accuracy-tag {
    display: inline-block;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    color: var(--accent-ink);
    margin-left: 6px;
  }
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <h1>채널 × 앱스플라이어 성과 리포트</h1>
      <div class="meta-line">집계 기간 <span class="num" id="date-range"></span> · 일/캠페인/그룹/소재 기준 조인</div>
    </div>
    <div class="filecount">
      channel CSV <b id="n-channel"></b>개 · appsflyer CSV <b id="n-af"></b>개 불러옴<br />

  </header>

  <section>

    <div class="kpi-grid" id="kpi-grid"></div>
  </section>

  <section>
    <h2>채널별 비교</h2>
    <div class="channel-grid">
      <div class="table-scroll">
        <table id="channel-table"></table>
      </div>
      <div class="barchart" id="channel-bars"></div>
    </div>
  </section>

  <section>
    <h2>캠페인별 비용 · ROAS</h2>
    <div class="camp-wrap" id="campaign-bars"></div>
  </section>

  <section>
    <h2>소재별 성과 <span style="font-weight:400; text-transform:none; letter-spacing:0;">(구매매출 순)</span></h2>
    <div class="table-scroll">
      <table id="creative-table"></table>
    </div>
  </section>

  <footer>
    CTR·CVR·CPA·ROAS는 channel(노출·클릭·비용)과 appsflyer(전환) 원본 합산값 기반 계산값입니다 <span class="accuracy-tag">추정 아님</span>.
    데이터는 이 리포트를 생성한 시점의 스냅샷이며, 새 날짜 파일이 추가되면 재생성이 필요합니다.
  </footer>
</div>

<script>
(function () {

  const channelClass = (name) => name === "구글" ? "google" : name === "메타" ? "meta" : name === "네이버" ? "naver" : "";
  const channelColorVar = (name) => name === "구글" ? "var(--google)" : name === "메타" ? "var(--meta)" : name === "네이버" ? "var(--naver)" : "var(--ink-dim)";
  const roasClass = (v) => v >= 1000 ? "roas-good" : v >= 300 ? "roas-warn" : "roas-bad";

  document.getElementById("date-range").textContent = data.dates.length > 1
    ? `${data.dates[0]} ~ ${data.dates[data.dates.length - 1]}`
    : data.dates[0];
  document.getElementById("n-channel").textContent = data.n_channel_files;
  document.getElementById("n-af").textContent = data.n_af_files;
  document.getElementById("unmatched").textContent = data.unmatched;

    { label: "비용", value: fmtMoney(kpi.cost) },
    { label: "회원가입", value: fmt(kpi.signups) },
    { label: "구매", value: fmt(kpi.purchases), sub: `CPA ${fmtMoney(kpi.cpa)}` },

  document.getElementById("kpi-grid").innerHTML = kpiDefs.map(k => `
    <div class="kpi">
      <div class="label">${k.label}</div>

        <td class="num">${r.CTR}%</td>

        <td class="num">${fmt(r.구매)}</td>
        <td class="num">${fmtMoney(r.구매매출)}</td>
        <td class="num">${fmtMoney(r.CPA)}</td>
        <td class="num">
          <div class="roas-cell">
            <span class="${roasClass(r.ROAS)}">${r.ROAS}%</span>
            <span class="mini-track"><span class="mini-fill" style="width:${Math.min(100, r.ROAS / maxCreativeRoas * 100).toFixed(1)}%; background:${channelColorVar(r.채널)}"></span></span>
          </div>
        </td>
      </tr>`).join("")}</tbody>`;
})();
</script>
